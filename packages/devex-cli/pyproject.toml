[project]
name = "devex-cli"
version = "0.1.0"
description = "Keystone devex CLI — the developer-facing interface to the shared engineering platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mauricio Perea", email = "mauriceperea93@gmail.com" }]
dependencies = [
    "typer>=0.12",          # CLI framework (Click-based, type-hint native)
    "rich>=13.7",           # pretty terminal output for standards-check / dora report
    "pydantic>=2.7",        # validate conventions.json + telemetry events against the schema
]

[project.scripts]
devex = "devex.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.155.7",    # property-based testing (PBT) — mandated by the PR pipeline
    "ruff>=0.15.18",
]

# ── Packaging ────────────────────────────────────────────────────────────────
# IMPORTANT (distribution invariant): this package is SELF-CONTAINED on purpose.
# It declares NO dependency on other monorepo packages and is NOT a uv-workspace
# member, so `uv tool install git+...#subdirectory=packages/devex-cli` resolves
# cleanly. The shared conventions.json is bundled as package data (see tool.hatch
# below) rather than referenced across packages. See ADR-0001.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devex"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the canonical conventions file into the wheel so the installed CLI is
# self-contained. `make sync-conventions` copies /conventions/conventions.json
# here before build; CI verifies the copy is in sync (drift = failed build).
"src/devex/_data/conventions.json" = "devex/_data/conventions.json"

[tool.ruff]
line-length = 100
target-version = "py312"
